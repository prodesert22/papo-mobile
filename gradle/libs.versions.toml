[versions]
# SDK Android
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"

# Build
agp = "9.5.2"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
compose-icons = "1.7.3"
sqldelight = "2.4.1"

# Bibliotecas
coroutines = "1.11.0"
serialization = "1.13.0"
datetime = "0.8.0"
kotlinx-io = "0.9.3"
normalize = "1.4.0"
ktor = "3.6.1"
navigation = "2.10.0"
lifecycle = "2.11.0"
coil = "3.6.3"
accompanist = "0.37.3"
zoomable = "2.16.0"
# Lista de licenças de terceiros: o plugin gera o JSON na compilação e o `core` o lê (sem a interface pronta, que abre links sem o filtro da regra 6).
aboutlibraries = "15.3.0"
# Só o motor de cores do Material (sem Compose): o MaterialKolor 5.0.1 exige material3 1.12.0-alpha03 e puxaria o projeto para uma alfa.
material-color-utilities = "5.0.1"
sqlcipher = "4.20.0"
webrtc = "1.3.10"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-sqlite = "2.7.1"
androidx-biometric = "1.1.0"
androidx-lifecycle = "2.11.1"
# Só para apagar tudo o que o WebView do player do YouTube guardou (WebStorageCompat.deleteBrowsingData, WebView 133+).
androidx-webkit = "1.18.0"
androidx-fragment = "1.9.1"
# Release candidate: trocar pela 1.12.0 estável antes da release. A correção de "falha no meio
# do stream lida como fim do arquivo" do media3-datasource-ktor só existe a partir da 1.12.0.
media3 = "1.12.0-rc01"
# Push com o app fechado (FCM). A BoM fixa a versão do `firebase-messaging`; o plugin lê o `google-services.json`.
firebase-bom = "35.2.0"
google-services = "4.6.0"
turbine = "1.2.1"
# Só o leitor do aboutlibraries-core em Android usa org.json, e o android.jar dos testes na JVM só tem stubs: o teste precisa da implementação.
org-json = "20260814"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Kotlinx
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# `Task.await()` do Play Services: converte o token do FCM em suspend sem escrever o adaptador à mão.
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Texto
normalize = { module = "com.doist.x:normalize", version.ref = "normalize" }

# Rede
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Banco
sqldelight-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-jvm-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "webrtc" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }

# Imagens
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
accompanist-drawablepainter = { module = "com.google.accompanist:accompanist-drawablepainter", version.ref = "accompanist" }
# Pinça, toque duplo e arrasto do visualizador de imagens (Compose Multiplatform, Apache-2.0).
zoomable = { module = "net.engawapg.lib:zoomable", version.ref = "zoomable" }
# Esquemas de cor do Material por cor semente, para as predefinições de tema.
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }

# Licenças de terceiros: só o leitor do JSON gerado pelo plugin (Apache-2.0, multiplataforma).
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

# Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }

# Push (FCM). Sem versão: vem da BoM.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# Vídeo
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
# `ContentFrame` e `PlayerSurface`: só a superfície do vídeo em Compose; os controles são do app (ui/media/VideoControls.kt).
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-datasource-ktor = { module = "androidx.media3:media3-datasource-ktor", version.ref = "media3" }

# Testes
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
org-json = { module = "org.json:json", version.ref = "org-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
