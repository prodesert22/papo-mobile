name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI on {0}', inputs.ref || github.ref_name) }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release calls this whole workflow before publishing.
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test; empty uses the one from the event.
        type: string
        default: ''
    secrets:
      GOOGLE_SERVICES_JSON:
        description: Firebase client config of the app; without it the APKs are built with push off.
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Release script and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Test the release script
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check that a version change comes with its notes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/release.py changed-since "$BASE_SHA"
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  unit:
    name: Unit tests, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Without the secret (forks, pull requests from forks) the app builds with push off.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf %s "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is not set: building without push."
          fi
      - name: Run unit tests, lint and build the debug APK
        run: ./gradlew :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:assembleDebug --console=plain
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: Emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Without the secret (forks, pull requests from forks) the app builds with push off.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf %s "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON is not set: building without push."
          fi
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and the instrumented tests
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --console=plain
      # The real Keystore and native SQLCipher can only be tested on a device.
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tools/dev/run-device-tests.sh emulator-5554

  # Single gate: this is what branch protection and the release require.
  required:
    name: Full CI
    if: always()
    needs: [quality, unit, device]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not every job passed: $RESULTS"
              exit 1
            fi
          done
