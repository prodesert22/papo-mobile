name: Release
run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Manual release from {0}', github.ref_name) }}
on:
  # Pushing the tag publishes the version:
  # `git tag -a v1.0.1 -m "Papo Mobile 1.0.1" && git push origin v1.0.1`.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  # Manual run: reads `papo.version` from the chosen ref and creates the tag.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  identity:
    name: Identify the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # a manual run creates the tag
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      title: ${{ steps.identity.outputs.title }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: identity
        name: Validate the tag, the version and the notes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A final version only ships from a commit on main; make sure the reference exists to check it.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 tools/release.py version)"
          fi
          # Check before spending CI time: the tag matches papo.version and the notes exist.
          version="$(python3 tools/release.py check "$tag" --require-main)"

          # A published release is never replaced.
          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error::Release $tag is already published. To fix it, release a new version."
              exit 1
            fi
          fi

          if [ "$EVENT" != push ]; then
            head="$(git rev-parse HEAD)"
            if existing="$(git rev-parse --quiet --verify "refs/tags/$tag^{commit}")"; then
              if [ "$existing" != "$head" ]; then
                echo "::error::Tag $tag already exists on another commit ($existing)."
                exit 1
              fi
            else
              # A tag created with the workflow token does not trigger this workflow again.
              git tag "$tag" "$head"
              git push origin "refs/tags/$tag"
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "title=$(python3 tools/release.py title "$tag")"
            echo "prerelease=$(python3 tools/release.py prerelease "$tag")"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.tag }}

  build:
    name: Build the APKs
    needs: [identity, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Prepare the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Run tools/dev/setup-release-signing.sh --secrets."
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APKs
        env:
          PAPO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PAPO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PAPO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAPO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # No configuration cache: it would store on disk the values read from the environment, passwords included.
        run: ./gradlew :androidApp:assembleRelease -Ppapo.abiSplits=true --no-configuration-cache --console=plain
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify and name the APKs
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          code="$(python3 tools/release.py version-code "$VERSION")"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="androidApp/build/outputs/apk/release/androidApp-$abi-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::$apk was not found (an unsigned APK would carry the -unsigned suffix)."
              exit 1
            fi
            "$build_tools/apksigner" verify "$apk"
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            # Gradle and release.py each compute the version on their own; they must agree.
            if ! grep -q "versionName='$VERSION'" <<< "$badging" || ! grep -q "versionCode='$code'" <<< "$badging"; then
              echo "::error::$apk is not version $VERSION (versionCode $code)."
              exit 1
            fi
            cp "$apk" "dist/papo-mobile-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [identity, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.tag }}
          fetch-depth: 0 # the earlier tags define the comparison link
      - uses: actions/download-artifact@v8
        with:
          name: release-apks
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          TITLE: ${{ needs.identity.outputs.title }}
          PRERELEASE: ${{ needs.identity.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          notes="$RUNNER_TEMP/notes.md"
          python3 tools/release.py notes "$TAG" --repo "$GITHUB_REPOSITORY" > "$notes"

          # A beta is marked as a pre-release and never becomes the latest version.
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease)
            latest=(--prerelease --latest=false)
          else
            kind=()
            latest=(--latest)
          fi

          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error::Release $TAG is already published."
              exit 1
            fi
          else
            gh release create "$TAG" --draft "${kind[@]}" --verify-tag --title "$TITLE" --notes-file "$notes"
          fi
          # It only stops being a draft after every file has been uploaded.
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --title "$TITLE" --notes-file "$notes" --draft=false "${latest[@]}"
