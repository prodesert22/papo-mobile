name: Release
run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Release manual a partir de {0}', github.ref_name) }}
on:
  # Enviar a tag publica a versão: `git tag v1.0.1 && git push origin v1.0.1`.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  # Disparo manual: lê `papo.version` do ref escolhido e cria a tag.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  identity:
    name: Identificar a versão
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # o disparo manual cria a tag
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      title: ${{ steps.identity.outputs.title }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: identity
        name: Validar tag, versão e notas
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A versão final só sai de um commit da main; garante a referência para conferir.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 tools/release.py version)"
          fi
          # Confere antes de gastar o CI: a tag bate com papo.version e as notas existem.
          version="$(python3 tools/release.py check "$tag" --require-main)"

          # Uma release publicada nunca é substituída.
          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error::A release $tag já foi publicada. Para corrigir, lance uma nova versão."
              exit 1
            fi
          fi

          if [ "$EVENT" != push ]; then
            head="$(git rev-parse HEAD)"
            if existing="$(git rev-parse --quiet --verify "refs/tags/$tag^{commit}")"; then
              if [ "$existing" != "$head" ]; then
                echo "::error::A tag $tag já existe em outro commit ($existing)."
                exit 1
              fi
            else
              # Tag criada com o token do workflow não dispara este workflow de novo.
              git tag "$tag" "$head"
              git push origin "refs/tags/$tag"
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "title=$(python3 tools/release.py title "$tag")"
            echo "prerelease=$(python3 tools/release.py prerelease "$tag")"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.tag }}

  build:
    name: Compilar os APKs
    needs: [identity, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Preparar a keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam secrets de assinatura:$missing. Rode tools/dev/setup-release-signing.sh --secrets."
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Compilar os APKs assinados
        env:
          PAPO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PAPO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PAPO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAPO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Sem cache de configuração: ele guardaria em disco os valores lidos do ambiente, senhas incluídas.
        run: ./gradlew :androidApp:assembleRelease -Ppapo.abiSplits=true --no-configuration-cache --console=plain
      - name: Apagar a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Conferir e nomear os APKs
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          code="$(python3 tools/release.py version-code "$VERSION")"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="androidApp/build/outputs/apk/release/androidApp-$abi-release.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::Não encontrei $apk (um APK sem assinatura teria o sufixo -unsigned)."
              exit 1
            fi
            "$build_tools/apksigner" verify "$apk"
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            # O Gradle e o release.py calculam a versão cada um por si; têm de concordar.
            if ! grep -q "versionName='$VERSION'" <<< "$badging" || ! grep -q "versionCode='$code'" <<< "$badging"; then
              echo "::error::$apk não é da versão $VERSION (versionCode $code)."
              exit 1
            fi
            cp "$apk" "dist/papo-mobile-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publicar a release
    needs: [identity, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.tag }}
          fetch-depth: 0 # as tags anteriores definem o link de comparação
      - uses: actions/download-artifact@v8
        with:
          name: release-apks
          path: dist
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          TITLE: ${{ needs.identity.outputs.title }}
          PRERELEASE: ${{ needs.identity.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          notes="$RUNNER_TEMP/notes.md"
          python3 tools/release.py notes "$TAG" --repo "$GITHUB_REPOSITORY" > "$notes"

          # Um beta é marcado como pré-release e nunca vira a versão mais recente.
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease)
            latest=(--prerelease --latest=false)
          else
            kind=()
            latest=(--latest)
          fi

          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error::A release $TAG já foi publicada."
              exit 1
            fi
          else
            gh release create "$TAG" --draft "${kind[@]}" --verify-tag --title "$TITLE" --notes-file "$notes"
          fi
          # Só deixa de ser rascunho depois que todos os arquivos subiram.
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --title "$TITLE" --notes-file "$notes" --draft=false "${latest[@]}"
